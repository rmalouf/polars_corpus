# ruff, and nothing else, so it reports in seconds while test.yml is still
# building polars. Spindle has no matrix and no path filters: one file is one
# pipeline, and it runs on every push.

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "microvm"
image: "nixos"

clone:
  depth: 1

# The one ruff that runs here. PyPI's is dynamically linked against a loader a
# NixOS guest does not have, so the version is nixpkgs' rather than the
# lockfile's: if the two disagree about formatting, GitHub is the gate that
# counts and this one is noise. No uv and no venv -- ruff needs neither.
dependencies:
  - ruff

steps:
  - name: "ruff check"
    command: "ruff check python"

  - name: "ruff format"
    command: "ruff format --check python"
