# The Rust half plus the test suite. Lint and test share one pipeline because
# nothing caches between runs: splitting them would compile polars twice.
#
# Differences from .github/workflows/test.yml, which has to stay the stricter
# gate: no Python matrix (spindle has none, and a file per version would
# recompile polars for each), Linux only, and no macOS job to guard arm64.

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

# Not a NixOS image: PyPI's maturin, ruff and scipy wheels are dynamically
# linked against a loader NixOS does not provide, so the toolchain comes from
# the installers instead of from `dependencies`.
engine: "microvm"
image: "almalinux10"

clone:
  depth: 1

environment:
  CARGO_TERM_COLOR: "always"
  CARGO_HOME: "/usr/local/cargo"
  RUSTUP_HOME: "/usr/local/rustup"
  # The newest supported version, where a break shows up first. GitHub covers
  # 3.11 through 3.14; here there is room for one.
  UV_PYTHON: "3.14"
  # dev-fast is the release profile without LTO: the tests stay fast to run
  # without paying for a full release build.
  MATURIN_PEP517_ARGS: "--profile dev-fast"

steps:
  # cargo needs a linker, so gcc comes along. The symlinks put cargo and rustc
  # on the default PATH, which the steps below inherit unchanged.
  - name: "Install toolchain"
    command: |
      dnf install -y gcc
      curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --no-modify-path --profile minimal -c clippy,rustfmt
      ln -s "$CARGO_HOME"/bin/* /usr/local/bin/

  - name: "cargo fmt"
    command: "cargo fmt --all --check"

  # Checks only, so the crate never links: an extension-module cdylib has no
  # Python symbols to link against outside the interpreter.
  - name: "cargo clippy"
    command: "cargo clippy --all-targets"
    environment:
      RUSTFLAGS: "-Dwarnings"

  # The examples extra brings matplotlib, without which the plotting tests skip
  # themselves.
  - name: "Build extension and install dependencies"
    command: "uv sync --group dev --extra examples"

  # The corpora test_convert.py reads. Downloaded every run: spindle caches Nix
  # derivations between pipelines, and this pipeline has none. punkt_tab is not
  # a corpus: state_union ships no sentence boundaries, so its reader tokenizes
  # them with PunktTokenizer.
  - name: "Download nltk corpora"
    command: >
      uv run --no-sync python -m nltk.downloader
      brown treebank state_union panlex_swadesh lin_thesaurus punkt_tab

  - name: "Run Python tests"
    command: "uv run --no-sync pytest"
