# The Rust half plus the test suite. cargo fmt and clippy run here rather than
# in lint.yml because nothing caches between pipelines: splitting them off would
# compile polars twice.
#
# Manual-only, like docs.yml, because compiling polars from source on every
# pipeline runs past the time limit: what spindle caches between runs is Nix
# derivations, and a cargo build tree is not one. GitHub is the gate that
# counts meanwhile. Put the push and pull_request triggers back if there is
# ever something for the build to resume from.
#
# Differences from .github/workflows/test.yml: no Python matrix (spindle has
# none, and a file per version would recompile polars for each), Linux only,
# and no macOS job to guard arm64.

when:
  - event: ["manual"]
    branch: ["main"]

engine: "microvm"
image: "nixos"

clone:
  depth: 1

dependencies:
  - gcc
  - cargo
  - rustc
  - clippy
  - rustfmt
  - uv
  - python313

environment:
  CARGO_TERM_COLOR: "always"
  # uv's own CPython builds are dynamically linked, which a NixOS guest cannot
  # exec, so the version is whichever nixpkgs packages rather than the newest
  # supported. `make grid` is what covers the rest before a release.
  UV_PYTHON: "3.13"
  UV_PYTHON_PREFERENCE: "only-system"
  UV_PYTHON_DOWNLOADS: "never"
  # dev-fast is the release profile without LTO: the tests stay fast to run
  # without paying for a full release build. `--compatibility linux` skips the
  # manylinux audit, which the guest's Nix-store glibc fails; the wheel is
  # installed here and never published.
  MATURIN_PEP517_ARGS: "--profile dev-fast --compatibility linux"

steps:
  - name: "cargo fmt"
    command: "cargo fmt --all --check"

  # Checks only, so the crate never links: an extension-module cdylib has no
  # Python symbols to link against outside the interpreter.
  - name: "cargo clippy"
    command: "cargo clippy --all-targets"
    environment:
      RUSTFLAGS: "-Dwarnings"

  # No `--extra examples` here, unlike GitHub: its numpy needs a libstdc++ the
  # guest has nowhere to load from, and a broken matplotlib is worse than an
  # absent one -- pytest.importorskip only skips on ModuleNotFoundError. The
  # plotting tests skip; GitHub and `make grid` run them.
  - name: "Build extension and install dependencies"
    command: "uv sync --group dev"

  # The corpus test_convert.py reads. Downloaded every run: what spindle caches
  # between pipelines is Nix derivations, and this is not one.
  - name: "Download nltk corpora"
    command: "uv run --no-sync python -m nltk.downloader brown"

  - name: "Run Python tests"
    command: "uv run --no-sync pytest"
