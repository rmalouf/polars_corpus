site_name: polars_corpus
site_description: Polars extensions for corpus linguistics
repo_url: https://github.com/rmalouf/polars_corpus

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Read the sources here rather than an installed polars_corpus, so a
          # docs build needs neither the venv nor the compiled extension.
          paths: [python]
          options:
            heading_level: 2
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            separate_signature: true
            docstring_section_style: list
            inherited_members: true

  - mkdocs-jupyter:
      # Render the outputs committed with the notebooks. Executing here would
      # need the corpora they read, which are too large to keep in the repo.
      execute: false
      include_requirejs: true
      custom_mathjax_url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
#  - User Guide:
#      - Getting started: guide/getting-started.ipynb
#      - Working with corpora: guide/corpora.ipynb
  - Examples:
      - Word frequencies: notebooks/frequencies.ipynb
      - Concordances: notebooks/concordance.ipynb
      - Keyword Analysis: notebooks/keywords.ipynb
      - Dispersion: notebooks/dispersion.ipynb
  - Reference:
      - Search: search.md
      - Association metrics: assoc.md
      - Lexical dispersion: dispersion.md
      - Keyword analysis: keywords.md
      - Embeddings: embed.md
      - Utilities: utils.md
      - Simple query language: simple_query.md

