site_name: polars-corpus
site_description: Corpus search, concordancing, and statistical measures for Polars
site_author: Rob Malouf

theme:
  name: zensical

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      include_source: true

nav:
  - Home: index.md
  - User Guide:
    - Installation: guide/installation.md
    - Data Format: guide/data-format.md
    - Query Language:
      - Simple Queries: guide/query/simple.md
      - CQP Queries: guide/query/cqp.md
    - Concordancing: guide/concordancing.md
    - Frequency Analysis: guide/frequencies.md
    - Collocations: guide/collocations.md
  - Examples:
    - Concordance: examples/concordance.ipynb
    - Concordance (CQP): examples/concordance_cqp.ipynb
    - Frequencies: examples/frequencies.ipynb
    - Collocations: examples/collocation.ipynb
    - Keywords: examples/keywords.ipynb
    - Stylometry: examples/stylometry.ipynb
    - Zipf's Law: examples/zipf.ipynb
  - API Reference:
    - Search: api/search.md
    - Association Measures: api/assoc.md
    - Lexical: api/lexical.md
    - Productivity: api/productivity.md
    - Views: api/view.md
    - Visualizations: api/visualizations.md
    - IO: api/io.md
