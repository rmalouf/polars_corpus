[package]
name = "polars-corpus"
version = "0.2.1"
edition = "2024"
exclude = [".claude", ".github", ".tangled", "docs", "examples", "mkdocs.yml", "uv.lock"]

[lib]
name = "polars_corpus"
crate-type= ["cdylib"]

[dependencies]
# 0.29.3 recurses through PolarsAllocator on first attach and segfaults on import.
pyo3 = { version = "=0.29.2", default-features = false, features = ["extension-module", "abi3-py311"] }
polars = { version = "0.55", default-features = false, features = ["dtype-struct", "dtype-array", "dtype-categorical", "performant", "cse"] }
# polars' own `rle` feature only forwards to polars-lazy, which this crate
# doesn't build, so enable it on polars-ops directly. Re-exported through
# polars::prelude.
polars-ops = { version = "0.55", default-features = false, features = ["rle"] }
pyo3-polars = { version = "0.28", default-features = false, features = ["derive"] }
flate2 = "1.1"
zstd = "0.13"
statrs = { version = "0.19", default-features = false }
itertools = "0.15.0"
polars-arrow = { version = "0.55", default-features = true }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Fast-turnaround profile for `make develop`. Not for distribution wheels -- see `make build`.
[profile.dev-fast]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
debug = "line-tables-only"
strip = "none"

# Release build with debug info kept and cross-crate inlining disabled.
# Build with`--profile profiling`.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
lto = "off"
