[package]
name = "polars-corpus"
version = "0.1.0"
edition = "2024"

[lib]
name = "polars_corpus"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
polars = { version = "0.49" }
polars-arrow = { version = "0.49" }
pyo3-polars = { version = "0.22", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whichlang = "0.1"

