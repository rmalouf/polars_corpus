[package]
name = "polars-corpus"
version = "0.2.0-pre"
edition = "2024"

[lib]
name = "polars_corpus"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", default-features = false, features = ["extension-module", "abi3-py39"] }
polars = { version = "0.54", default-features = false, features = ["dtype-struct", "dtype-array", "performant", "cse"] }
pyo3-polars = { version = "0.27", default-features = false, features = ["derive"] }
statrs = { version = "0.18", default-features = false }
itertools = "0.14"
polars-arrow = { version = "0.54", default-features = true }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
#debug = true
#debug = "line-tables-only"  # or "limited"/"full" if you want more
debug = "full"  # or "limited"/"full" if you want more
strip = "none"
lto = "off"                 # reduces cross-crate inlining + improves attribution
codegen-units = 1

[profile.profiling]
inherits = "release"
#debug = "line-tables-only"  # or "limited"/"full" if you want more
#debug = true
debug = "full"  # or "limited"/"full" if you want more
strip = "none"
lto = "off"                 # reduces cross-crate inlining + improves attribution
codegen-units = 1           # optional: improves stability of profiles# optional: improves stability of profiles