[package]
name = "polars-corpus"
version = "0.1.0"
edition = "2024"

[lib]
name = "polars_corpus"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", default-features = false, features = ["extension-module", "abi3-py39", "nightly"] }
polars = { version = "0.51", default-features = false, features = ["dtype-struct", "dtype-array"] }
pyo3-polars = { version = "0.24", default-features = false, features = ["derive"] }
statrs = { version = "0.18", default-features = false }
itertools = "0.14"
polars-arrow = { version = "0.51", default-features = true }
serde = { version = "1.0", features = ["derive"] }
