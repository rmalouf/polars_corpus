[package]
name = "polars-corpus"
version = "0.1.0"
edition = "2024"

[lib]
name = "polars_corpus"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }
pyo3-polars = { version = "0.21", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.48", default-features = false }
polars-arrow = { version = "0.48", default-features = false }
serde_json = "1"
whichlang = "0.1"
