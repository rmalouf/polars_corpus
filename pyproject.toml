[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.36,<2.0"]
build-backend = "maturin"

[project]
name = "polars-corpus"
version = "0.2.0-pre"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
authors = [
    {name = "Rob Malouf", email="rmalouf@sdsu.edu"}
]
description = "Text processing plugins for polars"
readme = "README.md"
license = "MIT"
# minimum polars version is also hard-coded in Makefile and .github/workflows/release.yml
dependencies = [
    "polars>=1.36,<2.0",
    "lark>=1.2",
    "nltk>=3.9",
    "anywidget>=0.9",
]

[project.optional-dependencies]
# lxml and pyarrow>=14 are what convert_bnc needs; pyarrow>=14 is also required by seaborn
examples = ["great_tables", "scipy", "matplotlib", "seaborn", "lxml", "pyarrow>=14", "statsmodels", "adjusttext"]
embeddings = ["sentence-transformers", "model2vec", "umap-learn",
    "hdbscan"]

[project.urls]
Repository = "https://github.com/rmalouf/polars_corpus"
Issues = "https://github.com/rmalouf/polars_corpus/issues"

[tool.ruff]
extend-exclude = ["examples/*.ipynb"]
force-exclude = true

[tool.pyrefly.errors]
bad-override-mutable-attribute = "ignore"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
# simple_parser's docstring examples are the reference for the query language,
# so they are executed. importlib mode keeps it importable as part of the
# package, which its relative imports need.
addopts = "--doctest-modules --import-mode=importlib"
testpaths = ["python/tests", "python/polars_corpus/simple_parser.py"]

[tool.maturin]
module-name = "polars_corpus._internal"
python-source = "python"

[tool.pyrefly]
ignore-missing-imports = ["polars_corpus._internal"]

[dependency-groups]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    # mkdocstrings formats the signatures it renders with ruff, if it is there.
    "ruff>=0.15,<0.16",
]
dev = [
    {include-group = "docs"},
    "coverage>=7.10",
    "jupyterlab>=4.4.0",
    # convert_bnc, and so its tests, need these.
    "lxml",
    "maturin>=1.8.3",
    "notebook>=7.4.0",
    "pip>=25.0.1",
    "pyarrow>=14",
    "pyrefly>=0.62",
    "pytest>=8.3.5",
]
# Everything `dev` has, plus what the example notebooks and user guide import.
# Sync with `uv sync --group notebooks`. Distinct from the published
# `examples` extra above, which is the minimum an end user needs.
notebooks = [
    {include-group = "dev"},
    "adjustText",
    "cytoolz",
    "fastexcel",
    "great-tables",
    "matplotlib",
    "scipy",
    "scipy-stubs",
    "seaborn",
    "selenium",
]
