[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.35"]
build-backend = "maturin"

[project]
name = "polars-corpus"
version = "0.2.0-pre"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
authors = [
    {name = "Rob Malouf", email="rmalouf@sdsu.edu"}
]
description = "Text processing plugins for polars"
readme = "README.md"
license = "MIT"
dependencies = [
    "polars>=1.35",
    "lark>=1.2",
    "nltk>=3.9",
    "anywidget>=0.9"
]

[project.optional-dependencies]
# pyarrow is seaborn's, not ours: below 14 it takes the deprecated dataframe
# interchange path for a polars frame and warns on every plot. It goes when
# seaborn does.
examples = ["great_tables", "scipy", "matplotlib", "seaborn", "pyarrow>=14", "statsmodels"]
embeddings = ["sentence-transformers", "model2vec", "adjusttext", "umap-learn",
    "hdbscan"]

[project.urls]
Repository = "https://github.com/rmalouf/polars_corpus"
Issues = "https://github.com/rmalouf/polars_corpus/issues"

[tool.ruff]
# The example and user-guide notebooks are working scratchpads and are routinely
# left mid-edit, with undefined names and unused imports. Lint and format the
# .py sources only.
extend-exclude = ["*.ipynb"]
# Apply the exclusion even when a notebook is named directly on the command
# line, which is what editors and pre-commit hooks do.
force-exclude = true

[tool.pyrefly.errors]
bad-override-mutable-attribute = "ignore"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
# simple_parser's docstring examples are the reference for the query language,
# so they are executed. importlib mode keeps it importable as part of the
# package, which its relative imports need.
addopts = "--doctest-modules --import-mode=importlib"
testpaths = ["python/tests", "python/polars_corpus/simple_parser.py"]

[tool.maturin]
module-name = "polars_corpus._internal"
python-source = "python"

[tool.pyrefly]
# _internal is the compiled Rust extension; its stubs live in _internal.pyi but
# the module itself is only importable after `make develop`.
ignore-missing-imports = ["polars_corpus._internal"]

[dependency-groups]
# What `mkdocs build` needs and nothing else, so the docs workflow can install
# it with `uv sync --only-group docs` and skip building the Rust extension.
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    # mkdocstrings formats the signatures it renders with ruff, if it is there.
    "ruff>=0.15,<0.16",
]
dev = [
    {include-group = "docs"},
    "coverage>=7.10",
    "jupyterlab>=4.4.0",
    "maturin>=1.8.3",
    "notebook>=7.4.0",
    "pip>=25.0.1",
    "pyrefly>=0.62",
    "pytest>=8.3.5",
]
# Everything `dev` has, plus what the example notebooks and user guide import.
# Sync with `uv sync --group notebooks`. Distinct from the published
# `examples` extra above, which is the minimum an end user needs.
notebooks = [
    {include-group = "dev"},
    "adjustText",
    "cytoolz",
    "fastexcel",
    "great-tables",
    "joblib",
    "joblib-progress",
    "lxml",
    "matplotlib",
    "pyarrow>=14",
    "scipy",
    "scipy-stubs",
    "seaborn",
    "selenium",
]
