[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[project]
name = "polars-text"
version = "0.1.0"
requires-python = "==3.12.*"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
 "nltk>=3.9.1",
 "polars>=1.25.2",
 "seaborn>=0.13.2",
 "spacy[apple]==3.8.*",
 "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
 "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
]

[tool.uv]
python-preference = "only-managed"

[tool.mypy]
ignore_missing_imports = false
strict = true

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true

[tool.maturin]
module-name = "polars_text._internal"

[dependency-groups]
dev = [
    "jupyterlab>=4.3.6",
    "maturin>=1.8.3",
    "mypy>=1.15.0",
    "notebook>=7.3.3",
    "pip>=25.0.1",
    "pytest>=8.3.5",
]
