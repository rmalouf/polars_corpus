# Test building docs (but don't deploy)

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'python/polars_corpus/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'python/polars_corpus/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # Distinct from the CI workflow's caches, which otherwise derive the
          # same key and race to reserve it when both workflows run on a push.
          cache-suffix: docs

      # --only-group installs mkdocs without building the Rust extension.
      # mkdocstrings reads the sources under python/ (see mkdocs.yml), and the
      # notebooks are rendered from their committed outputs, so the docs need
      # neither the extension nor the corpora.
      - name: Install documentation dependencies
        run: uv sync --only-group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
