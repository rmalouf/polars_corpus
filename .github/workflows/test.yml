name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install ruff
        run: uv sync --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check python
      - name: ruff format
        run: uv run --no-sync ruff format --check python

  python:
    name: Python ${{ matrix.python }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15', '3.15t']
    env:
      UV_PYTHON: ${{ matrix.python }}
      MATURIN_PEP517_ARGS: --profile dev-fast
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.python }}
          python-version: ${{ matrix.python }}
      - name: Build extension and install dependencies
        run: uv sync --group dev --extra examples
      # An extension module that doesn't declare itself free-threading safe
      # quietly turns the GIL back on at import.
      - name: Check the GIL stays off
        if: ${{ endsWith(matrix.python, 't') }}
        run: >
          uv run --no-sync python -c
          "import sys, polars_corpus; assert not sys._is_gil_enabled(), 'GIL re-enabled on import'"
      - name: Cache nltk data
        uses: actions/cache@v6
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: Download nltk corpora
        run: >
          uv run --no-sync python -m nltk.downloader brown
      - name: Run Python tests
        run: uv run --no-sync pytest
