name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install ruff
        run: uv sync --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check python
      - name: ruff format
        run: uv run --no-sync ruff format --check python

  python:
    name: Python 3.14 on Linux
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.14'
      MATURIN_PEP517_ARGS: --profile dev-fast
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: test
          python-version: '3.14'
      - name: Build extension and install dependencies
        run: uv sync --group dev --extra examples
      - name: Cache nltk data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
      - name: Download nltk corpora
        run: >
          uv run --no-sync python -m nltk.downloader brown
      - name: Run Python tests
        run: uv run --no-sync pytest
